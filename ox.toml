# ox.toml - ox deploy manifest for oxzoo-vue-vite.
# nginx serves dist/ from the current release (spa = true) and proxies only
# /api and /health to the web process, which is the Express API.

name = "oxzoo-vue-vite"
branch = "main"
runtime = "node"
framework = "generic"
package_manager = "npm"
port = 9103
environment_file = "/etc/ox/apps/oxzoo-vue-vite.env"

required_packages = ["nodejs"]

[[apt_sources]]
name = "nodesource"
url = "https://deb.nodesource.com/node_22.x"
suite = "nodistro"
components = ["main"]
key_url = "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"

[frontend]
dist = "dist"
api_paths = ["/api", "/health"]

[[processes]]
name = "web"
command = "node server/index.js"
readiness = "http://127.0.0.1:{port}/health"

[deploy]
install = ["npm", "ci"]
build = ["npm", "run", "build"]
health_url = "http://127.0.0.1:9103/health"

[[domains]]
name = "vue-vite.oxzoo.sorv.dev"
tls = false
spa = true
